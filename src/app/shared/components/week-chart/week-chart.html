<section class="chart-card">
  <header class="chart-header">
    <div class="chart-title">Estudos da semana</div>
  </header>

  <div class="chart-container">
    @if (hasStudyDataInWeek()) {
    <canvas #weekCanvas></canvas>
    } @else {
    <div class="chart-empty" role="status" aria-live="polite">
      <p class="chart-empty-title">Sem estudos nesta semana.</p>
    </div>
    }
  </div>
</section>
