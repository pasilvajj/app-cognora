<div class="discipline-card">

  <div class="header">
    <h3>Progresso por disciplina</h3>
  </div>

  <div class="discipline-list" *ngIf="items().length > 0">

    <div class="discipline-item" *ngFor="let d of items(); trackBy: trackByName">

      <div class="discipline-info">
        <span class="name">{{ d.name }}</span>
        <span class="percent">{{ formatPct(d.percent) }}</span>
      </div>

      <div class="progress-bar" [class.progress-bar--empty]="d.percent <= 0">
        <div
          class="progress-fill"
          [ngClass]="'progress-fill--' + progressTone(d.percent)"
          [style.width.%]="d.percent">
        </div>
      </div>

    </div>

  </div>

  <p class="empty-hint" *ngIf="items().length === 0">
    Nenhum dado de progresso para este ciclo ainda.
  </p>

</div>
