 
 <div class="page-top">
    <a class="back-link" routerLink="/ciclos">
      ← <span>Voltar para meus ciclos</span>
    </a>
  </div> 

 <div class="ciclo-card">
    <div class="ciclo-card__icon">
        <span class="logo-placeholder">▲</span>
      </div>

      <div class="ciclo-card__content">
        <!-- 🔹 EDITAR -->
        <input
          *ngIf="modo === 'edit'"
          class="ciclo-nome-input"
          [ngModel]="nome"
          (ngModelChange)="nomeChange.emit($event)"
          maxlength="70"
          placeholder="Nome do ciclo"
        />
        <!-- 🔹 VISUALIZAÇÃO -->
        <div *ngIf="modo === 'view'"
          class="nomeCiclo"
          aria-disabled="true">
          {{ nome }}
        </div>

       <div class="ciclo-card__meta">
          <div class="meta-item">
            <span class="label">Cargo:</span>
            <span class="value">{{ cargoNome }}</span>
          </div>

          <div class="meta-item meta-item--duracao">
            <span class="label">Duração do ciclo</span>
            <ng-container *ngIf="modo === 'view'">
              <span class="value">{{ cargaHorariaSemanal }}h/sem</span>
            </ng-container>
            <div *ngIf="modo === 'edit'" class="duracao-edit">
              <input
                type="number"
                class="duracao-input"
                min="1"
                max="168"
                step="1"
                [ngModel]="cargaHorariaSemanal"
                (ngModelChange)="cargaHorariaSemanalChange.emit($event)"
              />
              <span class="duracao-suffix">h/semana</span>
            </div>
          </div>
        </div>
      </div>
  </div>
