<div class="dashboard">
  <header class="dashboard-header">
    <div class="title">
      <h1>Home</h1>
      <p>Visão geral do seu desempenho</p>
    </div>

    <div class="dashboard-actions">
      <app-ciclo-selector [ciclos]="ciclos" [selectedId]="cicloId" (selectedIdChange)="onCicloChange($event)"
        [loading]="ciclosLoading()" [disabled]="ciclosLoading() || loading" label="Ciclo">
      </app-ciclo-selector>
    </div>
  </header>

  <div class="dashboard-mobile-order-bar">
    <span class="dashboard-mobile-order-label" id="dashboard-mobile-order-label">Ordem dos cards em coluna</span>
    <div class="dashboard-mobile-order-toggle" role="group" aria-labelledby="dashboard-mobile-order-label">
      <button type="button" class="order-chip" [class.order-chip--active]="cardsMobileOrder() === 'summary-first'"
        (click)="setMobileCardOrder('summary-first')">Resumo primeiro</button>
      <button type="button" class="order-chip" [class.order-chip--active]="cardsMobileOrder() === 'session-first'"
        (click)="setMobileCardOrder('session-first')">Sessão primeiro</button>
    </div>
  </div>

  <section class="dashboard-cards" [class.dashboard-cards--session-first]="cardsMobileOrder() === 'session-first'">
    <app-metric-card type="time" icon="time" title="Estudado na semana" [value]="timeValue"
      [footerText]="timeFooterText" [footerTone]="timeFooterTone">
    </app-metric-card>

    <app-metric-card type="streak" icon="calendar" title="Sequência" [value]="streakValue"
      [footerText]="streakFooterText" footerTone="primary">
    </app-metric-card>

    <app-metric-card
      type="time"
      icon="book"
      title="Horas do ciclo"
      [value]="cicloHorasFeitas"
      [subtitle]="'Esperado: ' + cicloHorasEsperadas"
      [footerText]="cicloHorasFooterText"
      [footerTone]="cicloHorasFooterTone">
    </app-metric-card>

    <!-- CARD INTELIGENTE -->
    <app-metric-card type="next" title="Sessão" [value]="actionTitle" [subtitle]="actionSubtitle"
      [actionLabel]="actionText"
      [footerText]="actionFooterText" [footerTone]="actionFooterTone"
      [actionDisabled]="actionDisabled() || loading"
      [actionLoading]="acaoCardLoading()"
      (action)="onActionClick()">
    </app-metric-card>
  </section>

  <section class="dashboard-main">
    <div class="dashboard-block chart">
      @if (cicloId) {
      <div class="dashboard-week-nav dashboard-week-nav--above-chart" aria-label="Semana do gráfico">
        <button type="button" class="dashboard-nav-btn" (click)="semanaAnterior()" [disabled]="loading"
          title="Semana anterior" aria-label="Semana anterior">‹</button>
        <div class="dashboard-week-range">{{ intervaloSemanaLabel }}</div>
        <button type="button" class="dashboard-nav-btn" (click)="proximaSemana()"
          [disabled]="loading || semanaPosteriorDesabilitada" title="Semana seguinte"
          aria-label="Semana seguinte">›</button>
      </div>
      }
      <app-week-chart [days]="semana"></app-week-chart>
    </div>

    <article class="block block-progress">
      <div class="block-body">
        <app-progress-bar [items]="progressoItems"></app-progress-bar>
      </div>
    </article>
  </section>
</div>
