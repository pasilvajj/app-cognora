<div class="page">
  <div class="page-container">

    <ng-container *ngIf="ciclo as c">
      <app-ciclo-header
        [nome]="modo === 'edit' ? nomeEdit : c.nome"
        (nomeChange)="nomeEdit = $event"
        [cargoNome]="c.cargoNome"
        [cargaHorariaSemanal]="modo === 'edit' ? cargaEdit : c.cargaHorariaSemanal"
        (cargaHorariaSemanalChange)="onCargaChange($event)"
        [modo]="modo">
      </app-ciclo-header>

      <div class="edit-extras" *ngIf="modo === 'edit'">
        <label class="pomodoro-row">
          <input type="checkbox" [(ngModel)]="pomodoroAtivo" />
          <span>Usar técnica Pomodoro neste ciclo</span>
        </label>
      </div>
    </ng-container>

    <!-- Estado -->
    <div class="state" *ngIf="loading">Carregando...</div>

    <!-- Lista -->
    <section class="card" *ngIf="!loading">
      <app-materias-ciclo-list
        [items]="disciplinas"
        [readonly]="modo === 'view'"
        (itemsChange)="onDisciplinasChange($event)">
      </app-materias-ciclo-list>
    </section>

    <div class="footer-actions" *ngIf="modo === 'edit'">
      <button
        type="button"
        class="action-primary"
        (click)="salvar()"
        [disabled]="salvando || loading">
        {{ salvando ? 'Salvando…' : 'Salvar alterações' }}
      </button>
    </div>
  </div>
</div>
