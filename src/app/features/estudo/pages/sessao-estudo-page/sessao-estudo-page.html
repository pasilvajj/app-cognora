@if (!loading() && sessao(); as s) {
<div class="page">

  <app-sessao-estudo-page-header
    [cicloNome]="s.cicloNome"
    [disciplinaNome]="s.disciplinaNome"
    [ordem]="s.ordem"
    (backClicked)="voltar()" />

  <app-sessao-estudo-session-card
    [disciplinaNome]="s.disciplinaNome"
    [tempoPlanejado]="tempoPlanejado()"
    [statusLabel]="statusLabel()"
    [pomodoroEnabled]="pomodoroEnabled()"
    [pomodoroTemporariamenteDesativado]="pomodoroTemporariamenteDesativado()"
    [observacoes]="observacoes()"
    [acaoLoading]="acaoLoading()"
    [retomarBloqueadoNaPausaCurta]="retomarBloqueadoNaPausaCurta()"
    (mainActionClick)="onMainActionClick()"
    (pomodoroSkipStage)="onPomodoroSkipStage()"
    (pomodoroToggleEnabled)="onPomodoroToggleEnabled()"
    (observacoesChange)="onObservacoesChange($event)"
    (observacoesSaveRequest)="onObservacoesSaveRequest($event)" />

</div>
} @else {
<!-- ================= STATE (Substitui o ng-template) ================= -->
<div class="state">
  {{ loading() ? 'Carregando sessão...' : 'Não foi possível carregar a sessão.' }}
</div>
}

<!-- Overlay fica fora do fluxo principal para evitar problemas de Z-Index -->
<app-pomodoro-overlay [visible]="pomodoroVisible()" [mode]="pomodoroMode()" [texto]="pomodoroTexto()"
  (closeOverlay)="onPomodoroCloseOverlay()" (nextStage)="onPomodoroNextStage()">
</app-pomodoro-overlay>
