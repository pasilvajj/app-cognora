<div class="page" *ngIf="!loading() && sessao; else state">

  <!-- ================= HEADER ================= -->
  <div class="header">
    <div>
      <h1>Sessão de Estudo</h1>

      <div class="sub">
        <span class="pill">{{ sessao.cicloNome }}</span>
        <span class="dot">•</span>
        <span class="muted">{{ sessao.disciplinaNome }}</span>
        <span class="dot">•</span>
        <span class="muted">Ordem #{{ sessao.ordem }}</span>
      </div>
    </div>

    <button class="btn-back" type="button" (click)="voltar()">
      Voltar
    </button>
  </div>

  <!-- ================= CARD ================= -->
  <section class="card">

    <!-- HEADER DO CARD -->
    <div class="card-header">
      <div>
        <h2>{{ sessao.disciplinaNome }}</h2>
        <div class="meta">Planejado: {{ tempoPlanejado }}</div>
      </div>

      <span class="status-pill" [class.is-pausada]="timer.pausada()"
        [class.is-ready]="statusLabel() === 'Pronta para iniciar'" [class.is-running]="statusLabel() === 'Em andamento'"
        [class.is-done]="statusLabel() === 'Concluída'" [class.is-closed]="statusLabel() === 'Encerrada'">
        {{ statusLabel() }}
      </span>
    </div>

    <!-- ================= POMODORO ================= -->
    <app-pomodoro-timer *ngIf="pomodoroEnabled()" [sessaoFinalizada]="timer.finalizada()"
      (skipStage)="onPomodoroSkipStage()">
    </app-pomodoro-timer>

    <!-- ================= TIMER PRINCIPAL ================= -->
    <app-timer-display [decorridoMs]="timer.decorridoMs()" [metaMs]="timer.metaMs()">
    </app-timer-display>

    <!-- ================= AÇÃO PRINCIPAL ================= -->
    <div class="actions">
      <button class="btn-main" type="button" (click)="onMainActionClick()"
        [disabled]="timer.finalizada() || acaoLoading()">
        {{
        statusLabel() === 'Pronta para iniciar'
        ? 'Iniciar'
        : timer.pausada()
        ? 'Retomar'
        : 'Pausar'
        }}
      </button>
    </div>

    <!-- ================= OBSERVAÇÕES ================= -->
    <app-observacoes-editor [observacoes]="observacoes" [sessaoFinalizada]="timer.finalizada()"
      (observacoesChange)="onObservacoesChange($event)" (saveRequest)="onObservacoesSaveRequest($event)">
    </app-observacoes-editor>

  </section>
</div>

<app-pomodoro-overlay [visible]="pomodoroVisible()" [mode]="pomodoroMode()" [texto]="pomodoroTexto()"
  (closeOverlay)="onPomodoroCloseOverlay()" (nextStage)="onPomodoroNextStage()">
</app-pomodoro-overlay>

<!-- ================= STATE ================= -->
<ng-template #state>
  <div class="state">
    {{ loading() ? 'Carregando sessão...' : 'Não foi possível carregar a sessão.' }}
  </div>
</ng-template>
