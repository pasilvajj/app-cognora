@if (!loading() && sessao(); as s) {
<div class="page">

  <app-sessao-estudo-page-header
    [cicloNome]="s.cicloNome"
    [disciplinaNome]="s.disciplinaNome"
    [ordem]="s.ordem"
    (backClicked)="voltar()" />

  <app-sessao-estudo-session-card
    [disciplinaNome]="s.disciplinaNome"
    [estudoLivre]="!!s.estudoLivre"
    [tempoPlanejado]="tempoPlanejado()"
    [statusLabel]="statusLabel()"
    [pomodoroEnabled]="pomodoroEnabled()"
    [pomodoroTemporariamenteDesativado]="pomodoroTemporariamenteDesativado()"
    [observacoes]="observacoes()"
    [acaoLoading]="acaoLoading()"
    [retomarBloqueadoNaPausaCurta]="retomarBloqueadoNaPausaCurta()"
    [topicosOpcoes]="topicosOpcoes()"
    [topicoId]="s.topicoId ?? null"
    [topicoSelectDisabled]="!!s.fim"
    [metaSaving]="metaSelectsSaving()"
    [categoriaEstudo]="s.categoriaEstudo ?? null"
    [categoriaSelectDisabled]="!!s.fim"
    (mainActionClick)="onMainActionClick()"
    (modoFocoOpen)="abrirModoFoco()"
    (pomodoroSkipStage)="onPomodoroSkipStage()"
    (pomodoroToggleEnabled)="onPomodoroToggleEnabled()"
    (observacoesChange)="onObservacoesChange($event)"
    (observacoesSaveRequest)="onObservacoesSaveRequest($event)"
    (topicoChange)="onTopicoSelecionado($event)"
    (categoriaChange)="onCategoriaSelecionada($event)" />

</div>
} @else {
<!-- ================= STATE (Substitui o ng-template) ================= -->
<div class="state">
  {{ loading() ? 'Carregando sessão...' : 'Não foi possível carregar a sessão.' }}
</div>
}

<app-modo-foco-overlay
  [visible]="modoFocoAberto()"
  [pomodoroEnabled]="pomodoroEnabled()"
  [pomodoroDesativado]="pomodoroTemporariamenteDesativado()"
  [acaoLoading]="acaoLoading()"
  [retomarBloqueadoNaPausaCurta]="retomarBloqueadoNaPausaCurta()"
  [sessaoFinalizada]="!!sessao()?.fim || timer.finalizada()"
  [prontaParaIniciar]="statusLabel() === 'Pronta para iniciar'"
  (close)="fecharModoFoco()"
  (mainAction)="onMainActionClick()"
  (skipStage)="onPomodoroSkipStage()"
  (togglePomodoro)="onPomodoroToggleEnabled()"
/>

<!-- Overlay fica fora do fluxo principal para evitar problemas de Z-Index -->
<app-pomodoro-overlay
  [visible]="pomodoroVisible()"
  [mode]="pomodoroMode()"
  [texto]="pomodoroTexto()"
  [sessaoFinalizada]="!!sessao()?.fim || timer.finalizada()"
  [acaoLoading]="acaoLoading()"
  (closeOverlay)="onPomodoroCloseOverlay()"
  (nextStage)="onPomodoroNextStage()"
/>
