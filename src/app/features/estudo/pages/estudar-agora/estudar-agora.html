<div class="page">

  <app-estudar-agora-page-header
    [rodadaAtualNumero]="rodadaAtualNumero()"
    (backClicked)="voltarParaMeusCiclos()" />

  <div class="content">

    @if (aguardandoNovaRodada()) {
    <app-estudar-agora-ciclo-fim-banner
      [ultimaRodadaConcluidaNumero]="ultimaRodadaConcluidaNumero()"
      [iniciandoNovaRodada]="iniciandoNovaRodada()"
      (iniciarNovaRodadaConfirmada)="iniciarNovaRodadaConfirmada()" />
    }

    <app-estudar-agora-proxima-sessao-card
      [proximaSessaoDto]="proximaSessaoDto"
      [tempoPlanejadoLabel]="tempoPlanejadoLabel"
      [loading]="loading()"
      [aguardandoNovaRodada]="aguardandoNovaRodada()"
      (escolherOutraMateria)="abrirEscolha()"
      (iniciarEstudo)="iniciarEstudo()" />

    <app-estudar-agora-progresso-ciclo-card [progress]="progress" />

    <app-estudar-agora-observacoes-card
      [observacoesLoading]="observacoesLoading()"
      [observacoesMateria]="observacoesMateria" />

    <app-ultimas-sessoes-card
      title="Últimas Sessões"
      [sessions]="recentSessions"
      [cicloIdParaNavegacaoSessao]="cicloId"
    >
    </app-ultimas-sessoes-card>

    <app-escolher-materia-modal-circular [open]="modalOpen" [items]="itens"
      [sessoesConcluidasNaRodada]="sessoesConcluidasNaRodada"
      [defaultSelectedItemId]="selecionadoCicloItemId" [recommendedItemId]="selecionadoCicloItemId"
      (close)="modalOpen = false" (startSession)="onStartSession($event)">
    </app-escolher-materia-modal-circular>
  </div>
</div>
