<div class="pomodoro">
  <!-- esquerda -->
  <div class="pomodoro-left">
    <span class="mode-badge" [class.focus]="engine.isFocusMode()" [class.break]="!engine.isFocusMode()">
      {{ engine.modeLabel() }}
    </span>

    <span class="cycle-text">
      Ciclo {{ engine.cicloAtual() }} de {{ engine.totalCiclos() }}
    </span>
  </div>

  <!-- direita -->
  <div class="pomodoro-right">
    <div class="time-pill">
      {{ engine.timeLabel() }}
    </div>

    <button class="btn-ghost" type="button" (click)="onSkipStage()" [disabled]="!canSkip()">
      Pular etapa
    </button>

    <button class="btn-warning" type="button" (click)="onToggleEnabled()" [disabled]="sessaoFinalizada()">
      {{ desativado() ? 'Ativar agora' : 'Desativar agora' }}
    </button>
  </div>
</div>
