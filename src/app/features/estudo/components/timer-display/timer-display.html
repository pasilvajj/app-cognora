<div class="timer">
  <!-- 'floor' para o tempo que já passou -->
  <span class="time">{{ decorridoFormatado() }}</span>

  <div class="chips">
    <span class="chip chip-meta">
      Meta {{ metaFormatado() }}
    </span>

    <span class="chip chip-remaining">
      <div class="restante">Restam: {{ restanteFormatado() }}</div>
    </span>
  </div>
</div>
