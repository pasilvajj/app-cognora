<div class="timer">
  <!-- 'floor' para o tempo que já passou -->
  <div class="time">{{ decorridoMs | tempoRelogio:'floor' }}</div>

  <div class="chips">
    <span class="chip chip-meta">
      Meta {{ metaMs | tempoRelogio }}
    </span>

    <span class="chip chip-remaining">
      <!-- Calculamos o restante e usamos 'ceil' para arredondar para cima -->
      Restante {{ (metaMs - decorridoMs) | tempoRelogio:'ceil' }}
    </span>
  </div>
</div>
