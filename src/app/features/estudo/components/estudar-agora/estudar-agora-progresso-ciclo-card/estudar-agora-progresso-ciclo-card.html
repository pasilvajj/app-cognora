<section class="card">
  <div class="card-header">
    <h2>Progresso do Ciclo</h2>
  </div>

  <div class="card-body">
    <div class="progress-list">
      <div
        class="progress-row"
        *ngFor="let p of progress(); trackBy: trackByDisciplina"
        [class.progress-row--clickable]="rowClickable(p)"
        (click)="onRowClick(p)"
        (keydown.enter)="onRowClick(p)"
        (keydown.space)="$event.preventDefault(); onRowClick(p)"
        [tabindex]="rowClickable(p) ? 0 : -1"
        [attr.role]="rowClickable(p) ? 'button' : null"
      >
        <div class="left">
          <span class="drag">≡</span>
          <span class="disc">{{ p.disciplina }}</span>
        </div>

        <div class="mid">
          <div class="bar">
            <div class="fill" [ngClass]="getBarClass(p.percent)" [style.width.%]="p.percent"></div>
          </div>
        </div>

        <div class="right">
          <span class="pct">{{ formatPercent(p.percent) }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
