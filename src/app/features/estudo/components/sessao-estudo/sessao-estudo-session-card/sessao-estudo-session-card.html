<section class="card">
  <div class="card-header">
    <div>
      <h2>{{ disciplinaNome() }}</h2>
      <div class="meta">Planejado: {{ tempoPlanejado() }}</div>
    </div>

    <span class="status-pill" [class.is-pausada]="timer.pausada()"
      [class.is-ready]="statusLabel() === 'Pronta para iniciar'" [class.is-running]="statusLabel() === 'Em andamento'"
      [class.is-done]="statusLabel() === 'Concluída'" [class.is-closed]="statusLabel() === 'Encerrada'">
      {{ statusLabel() }}
    </span>
  </div>

  @if (estudoLivre()) {
  <div class="estudo-livre-callout" role="note">
    <p class="estudo-livre-callout-titulo">Sessão livre</p>
    <p class="estudo-livre-callout-texto">{{ estudoLivreMensagem }}</p>
  </div>
  }

  <div class="campos-meta-sessao">
    @if (topicosOpcoes().length > 0) {
    <div class="campo-topico">
      <span class="campo-rotulo">Tópico do edital</span>
      <select
        class="select-meta"
        [ngModel]="topicoSelectModel()"
        (ngModelChange)="onTopicoNgModel($event)"
        [disabled]="topicoSelectDisabled() || metaSaving()"
      >
        <option value="">— Opcional —</option>
        @for (o of topicosOpcoes(); track o.id) {
          <option [value]="'' + o.id">{{ o.titulo }}</option>
        }
      </select>
    </div>
    }

    <div class="campo-categoria">
      <span class="campo-rotulo">Categoria</span>
      <select
        class="select-meta"
        [ngModel]="categoriaSelectModel()"
        (ngModelChange)="onCategoriaNgModel($event)"
        [disabled]="categoriaSelectDisabled() || metaSaving()"
      >
        <option value="">Selecione…</option>
        @for (c of categoriasEstudo; track c.codigo) {
          <option [value]="c.codigo">{{ c.label }}</option>
        }
      </select>
    </div>
  </div>

  @if (pomodoroEnabled()) {
  <app-pomodoro-timer [sessaoFinalizada]="timer.finalizada()"
    [desativado]="pomodoroTemporariamenteDesativado()"
    (skipStage)="pomodoroSkipStage.emit()"
    (toggleEnabled)="pomodoroToggleEnabled.emit()">
  </app-pomodoro-timer>
  }

  <app-timer-display [decorridoMs]="timer.decorridoMs()" [metaMs]="timer.metaMs()">
  </app-timer-display>

  <div class="actions">
    <button class="btn-main" type="button" (click)="mainActionClick.emit()"
      [disabled]="timer.finalizada() || acaoLoading() || retomarBloqueadoNaPausaCurta()"
      [title]="retomarBloqueadoNaPausaCurta() ? 'Aguarde o fim da pausa curta para retomar.' : ''">
      {{
      statusLabel() === 'Pronta para iniciar'
      ? 'Iniciar'
      : timer.pausada()
      ? 'Retomar'
      : 'Pausar'
      }}
    </button>
  </div>

  <app-observacoes-editor [observacoes]="observacoes()" [sessaoFinalizada]="timer.finalizada()"
    (observacoesChange)="observacoesChange.emit($event)" (saveRequest)="observacoesSaveRequest.emit($event)">
  </app-observacoes-editor>

</section>
