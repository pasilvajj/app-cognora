<div class="login-container">
  <!-- LADO ESQUERDO (alinhado ao cadastro: overlay + ilustração central) -->
  <section class="login-left">
    <div class="left-content">
      <div class="brand">COGNORA</div>

      <div class="welcome">
        <p class="small">Bom te ver por aqui.</p>
        <h1>BEM-VINDO</h1>
        <p class="description">
          Organize seus estudos, acompanhe seu progresso e alcance seus objetivos com método.
        </p>
      </div>
    </div>
  </section>

  <section class="login-right">
    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="form-box">
      <h2>Entrar</h2>
      <p class="subtitle">Use seu e-mail e senha para continuar</p>

      <div class="form-error" *ngIf="error" role="alert">
        <p class="form-error__text">{{ error }}</p>
        <p class="form-error__detail" *ngIf="errorDetalhe">{{ errorDetalhe }}</p>
      </div>

      <app-form-input
        label="E-mail"
        type="email"
        placeholder="Digite seu e-mail"
        [control]="loginForm.controls.email"
        errorText="Informe um e-mail válido"
      />

      <app-form-input
        label="Senha"
        type="password"
        placeholder="Digite sua senha"
        [passwordHints]="false"
        [control]="loginForm.controls.password"
        errorText="Senha obrigatória"
      />

      <div class="options">
        <label class="keep-label">
          <input type="checkbox" [formControl]="loginForm.controls.keepSignedIn" />
          Manter conectado
        </label>
        <a routerLink="/register" class="register-link">Não tem conta? Cadastre-se</a>
      </div>

      <app-button
        type="submit"
        label="ENTRAR"
        [loading]="loading"
        [disabled]="loginForm.invalid"
        [fullWidth]="true"
      />
    </form>
  </section>
</div>
