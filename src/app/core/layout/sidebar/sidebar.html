<aside
  class="sidebar"
  aria-label="Cognora — navegação principal"
  [class.sidebar--rail]="!mobile && !open"
  [class.sidebar--offcanvas]="mobile && !open">

  <a
    routerLink="/dashboard"
    class="sidebar-header sidebar-brand"
    aria-label="Cognora — ir para a página inicial"
    title="Página inicial"
    (click)="onNavigate()">
    <img src="assets/icons/logo.svg" class="logo-icon" alt="" width="34" height="34">
    <span class="logo-text">Cognora</span>
  </a>

  <nav class="menu">
    <a routerLink="/dashboard" routerLinkActive="active" title="Home" (click)="onNavigate()">
      <img src="assets/icons/house.svg" class="icon-img" alt="">
      <span class="nav-label">Home</span>
    </a>

    <a routerLink="/ciclos" routerLinkActive="active" title="Meus Ciclos" (click)="onNavigate()">
      <img src="assets/icons/arrow-repeat.svg" class="icon-img" alt="">
      <span class="nav-label">Meus Ciclos</span>
    </a>

    <a routerLink="/planejamento" routerLinkActive="active" title="Meu planejamento" (click)="onNavigate()">
      <img src="assets/icons/book.svg" class="icon-img" alt="">
      <span class="nav-label">Meu planejamento</span>
    </a>

    <a routerLink="/edital-vertical" routerLinkActive="active" title="Edital verticalizado" (click)="onNavigate()">
      <img src="assets/icons/clipboard.svg" class="icon-img" alt="">
      <span class="nav-label">Edital vertical</span>
    </a>

    @if (isAdmin()) {
      <a routerLink="/catalogo" routerLinkActive="active" title="Catálogo de concursos" (click)="onNavigate()">
        <img src="assets/icons/book.svg" class="icon-img" alt="">
        <span class="nav-label">Catálogo</span>
      </a>
    }

    <a routerLink="/configuracoes" routerLinkActive="active" class="bottom" title="Configurações" (click)="onNavigate()">
      <img src="assets/icons/gear.svg" class="icon-img" alt="">
      <span class="nav-label">Configurações</span>
    </a>
  </nav>

</aside>
