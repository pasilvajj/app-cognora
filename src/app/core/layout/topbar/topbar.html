<header class="topbar">

  <button
    *ngIf="mobile"
    class="menu-btn"
    (click)="onMenuClick()">
    ☰
  </button>

  <div class="topbar-left">
    <span class="app-name">Cognora</span>
  </div>


<div class="topbar-right">
  <button
    class="theme-toggle"
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="isDarkTheme() ? 'Tema atual: Black. Clique para mudar para Claro' : 'Tema atual: Claro. Clique para mudar para Black'"
    [title]="isDarkTheme() ? 'Tema atual: Black • trocar para Claro' : 'Tema atual: Claro • trocar para Black'">
    {{ isDarkTheme() ? 'Black' : 'Claro' }}
  </button>

  <div class="right">
    <div class="user-area" (click)="toggleMenu()">
      <div class="avatar">
        {{ initials }}
      </div>

      <span class="username">
        {{ user?.name }}
      </span>

      <span class="chevron" [class.open]="menuOpen">▾</span>
    </div>

   @if (menuOpen) {
    <div class="dropdown menu-dropdown" role="menu" aria-label="Menu da conta">
      <button class="menu-item menu-item-danger" type="button" role="menuitem" (click)="logout()">
        <span class="menu-item-icon" aria-hidden="true">></span>
        <span class="menu-item-label">Sair</span>
      </button>
    </div>
    }
  </div>


    <!-- <div class="select-box">
      <span>PF 2025 - Agente</span>
      <i>▾</i>
    </div>

    <button class="icon-btn">🔔</button>

    <div class="profile">
      <img src="assets/avatar.png">
      <span class="user">
        👤 {{ userName }}
      </span>
    </div>

    <button class="logout-btn" (click)="logout()">
        Sair
      </button>

  </div> -->
</div>
</header>
