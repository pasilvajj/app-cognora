<header class="topbar">

  <div class="topbar-left">
    <button
      type="button"
      class="sidebar-toggle"
      (click)="onMenuClick()"
      [attr.aria-expanded]="ariaExpandedSidebar"
      [attr.aria-label]="ariaLabelSidebarToggle"
      [title]="ariaLabelSidebarToggle">
      <span class="sidebar-toggle-bars" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
  </div>

<div class="topbar-right">
  <button
    class="theme-toggle"
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="isDarkTheme() ? 'Tema atual: Black. Clique para mudar para Claro' : 'Tema atual: Claro. Clique para mudar para Black'"
    [title]="isDarkTheme() ? 'Tema atual: Black • trocar para Claro' : 'Tema atual: Claro • trocar para Black'">
    {{ isDarkTheme() ? 'Black' : 'Claro' }}
  </button>

  <div class="right">
    <div class="user-area" (click)="toggleMenu()">
      <div class="avatar">
        {{ initials }}
      </div>

      <span class="username">
        {{ user?.name }}
      </span>

      <span class="chevron" [class.open]="menuOpen">▾</span>
    </div>

   @if (menuOpen) {
    <div class="dropdown menu-dropdown" role="menu" aria-label="Menu da conta">
      <button
        class="menu-item menu-item-signout"
        type="button"
        role="menuitem"
        (click)="logout()"
        title="Terminar sessão">
        <span class="menu-item-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </span>
        <span class="menu-item-label">Sair</span>
      </button>
    </div>
    }
  </div>


    <!-- <div class="select-box">
      <span>PF 2025 - Agente</span>
      <i>▾</i>
    </div>

    <button class="icon-btn">🔔</button>

    <div class="profile">
      <img src="assets/avatar.png">
      <span class="user">
        👤 {{ userName }}
      </span>
    </div>

    <button class="logout-btn" (click)="logout()">
        Sair
      </button>

  </div> -->
</div>
</header>
